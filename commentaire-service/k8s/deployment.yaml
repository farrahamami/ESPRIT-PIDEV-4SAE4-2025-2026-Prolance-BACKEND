apiVersion: apps/v1
kind: Deployment
metadata:
  name: commentaire-service
  namespace: devops
spec:
  replicas: 1

  # ✅ Rolling Update : nouveau pod créé AVANT de supprimer l'ancien
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: commentaire-service

  template:
    metadata:
      labels:
        app: commentaire-service
    spec:
      automountServiceAccountToken: false

      # ✅ Attend que MySQL soit prêt avant de lancer Spring Boot
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql-service-commentaire 3306; do
                echo "MySQL not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "MySQL is ready!"

      containers:
        - name: commentaire-service
          # ✅ IMAGE_PLACEHOLDER remplacé par le CD via sed
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service-commentaire:3306/pidev_commentaire?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-commentaire
                  key: mysql-root-password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.mysql.cj.jdbc.Driver"
            - name: SERVER_PORT
              value: "8083"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
              cpu: "1"
          # ✅ Délais augmentés pour laisser Spring Boot démarrer correctement
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3