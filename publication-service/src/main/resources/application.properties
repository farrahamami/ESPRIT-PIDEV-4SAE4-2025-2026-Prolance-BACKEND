spring.application.name=publication-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/pidev_publication?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== JAEGER / TRACING =====
# Envoyer 100% des traces
management.tracing.sampling.probability=1.0
# Endpoint OTLP HTTP de Jaeger (port 4318)
management.otlp.tracing.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
# Activer les traces dans les logs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Exposer les endpoints actuator utiles
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# ============================