apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret-publication
  namespace: devops
type: Opaque
data:
  mysql-root-password: cm9vdA==                 # "root" encodé en base64
  mysql-database: cGlkZXZfcHVibGljYXRpb24=     # "pidev_publication" encodé en base64
---
# FIX: PersistentVolume statique en hostPath (si pas de provisioner dynamique sur le cluster)
# Si ton cluster a un StorageClass dynamique (ex: minikube → "standard", k3s → "local-path"),
# supprime ce bloc PV et décommente storageClassName dans le PVC ci-dessous.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-publication
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql-publication   # le dossier sera créé automatiquement sur le node
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc-publication
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual   # FIX: doit matcher le PV ci-dessus (ou votre StorageClass dynamique)
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-publication
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-publication
  template:
    metadata:
      labels:
        app: mysql-publication
    spec:
      automountServiceAccountToken: false
      # FIX: attendre que le PVC soit bound avant de démarrer
      initContainers:
        - name: wait-for-pvc
          image: busybox:1.36
          command: ['sh', '-c', 'until [ -d /var/lib/mysql ]; do echo waiting for volume; sleep 2; done']
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      containers:
        - name: mysql
          image: mysql:8.0.36
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-publication
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-publication
                  key: mysql-database
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
              cpu: "1"
          # FIX: readinessProbe pour que le service ne soit exposé que quand MySQL est prêt
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -u root -p${MYSQL_ROOT_PASSWORD} --silent"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -u root -p${MYSQL_ROOT_PASSWORD} --silent"
            initialDelaySeconds: 40
            periodSeconds: 20
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc-publication
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service-publication
  namespace: devops
spec:
  selector:
    app: mysql-publication
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None