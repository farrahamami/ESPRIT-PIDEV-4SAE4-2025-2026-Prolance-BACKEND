apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret-publication
  namespace: devops
type: Opaque
data:
  mysql-root-password: cm9vdA==                 # "root" encodé en base64
  mysql-database: cGlkZXZfcHVibGljYXRpb24=     # "pidev_publication" encodé en base64
---
# FIX (root cause CrashLoopBackOff): init SQL pour autoriser root depuis n'importe quel pod IP
# MySQL crée root@localhost uniquement par défaut → les pods Spring Boot (IP 10.32.x.x) sont rejetés.
# Le Docker entrypoint exécute automatiquement tous les *.sql dans /docker-entrypoint-initdb.d/
# IMPORTANT : ne s'exécute que sur un volume vierge. Supprimer le PVC/PV existant avant de reappliquer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-publication
  namespace: devops
data:
  init.sql: |
    ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';
    CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc-publication
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-publication
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-publication
  template:
    metadata:
      labels:
        app: mysql-publication
    spec:
      automountServiceAccountToken: false   # fix: kubernetes:S6865
      containers:
        - name: mysql
          image: mysql:8.0.36              # fix: kubernetes:S6596 (tag précis au lieu de latest)
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-publication
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-publication
                  key: mysql-database
          ports:
            - containerPort: 3306
          resources:                        # fix: kubernetes:S6892 / S6873 / S6864
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init           # FIX: montage du script d'init pour accès distant
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc-publication
        - name: mysql-init
          configMap:
            name: mysql-init-publication
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service-publication
  namespace: devops
spec:
  selector:
    app: mysql-publication
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None